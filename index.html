<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mohazan0 Tic Tac Toe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Syne',sans-serif;
  background:#0b0b12;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

/* BACKGROUND EFFECT */

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left,
    rgba(255,199,44,0.08),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(29,66,138,0.18),
    transparent 35%);
}

/* WATERMARK */

.watermark{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  z-index:0;
}

.watermark span{
  font-size:6rem;
  font-family:'Dancing Script',cursive;
  color:rgba(255,255,255,0.04);
  transform:rotate(-20deg);
  user-select:none;
}

/* MAIN CONTAINER */

.container{
  width:100%;
  max-width:530px;
  padding:20px;
  position:relative;
  z-index:1;
}

.card{
  background:#14141d;
  border:1px solid #2b2b40;
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* TITLES */

h1{
  text-align:center;
  font-size:2.6rem;
  margin-bottom:10px;

  background:linear-gradient(
    135deg,
    #ffc72c,
    #ffffff
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  color:#80809b;
  margin-bottom:26px;
}

/* PLAYER BOX */

.player-box{
  background:#1a1a28;
  border-radius:20px;
  padding:16px;
  margin-bottom:20px;
  border:1px solid #303048;
}

.player-box h2{
  margin-bottom:12px;
}

/* INPUT */

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-bottom:14px;
  background:#101018;
  color:white;
  font-size:1rem;
  outline:none;
}

/* CHARACTER SELECT */

.character-select{
  display:flex;
  gap:12px;
}

.character-btn{
  flex:1;
  border:none;
  border-radius:18px;
  cursor:pointer;
  transition:0.2s;
  padding:12px;
  background:#202032;
}

.character-btn:hover{
  transform:translateY(-4px);
}

.character-btn.selected{
  outline:3px solid #ffc72c;
}

/* JERSEY */

.jersey{
  width:92px;
  height:102px;
  margin:auto;

  border-radius:8px 8px 14px 14px;

  clip-path:polygon(
    18% 0%,
    82% 0%,
    100% 18%,
    100% 100%,
    0% 100%,
    0% 18%
  );

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* CURRY */

.curry-shirt{
  background:linear-gradient(
    165deg,
    #1d428a 55%,
    #ffc72c 55%
  );

  border:2px solid #ffc72c;
}

.curry-shirt .jersey-number,
.curry-shirt .jersey-name{
  color:#ffc72c;
}

/* RONALDO */

.ronaldo-shirt{
  background:linear-gradient(
    165deg,
    #ffffff,
    #efefef
  );

  border:2px solid #d4af37;
}

.ronaldo-shirt .jersey-number,
.ronaldo-shirt .jersey-name{
  color:#111;
}

.jersey-number{
  font-size:2rem;
  font-family:'JetBrains Mono',monospace;
  font-weight:900;
}

.jersey-name{
  font-size:0.55rem;
  font-weight:900;
  letter-spacing:2px;
}

/* START BUTTON */

.start-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#ffc72c;
  color:black;
  font-weight:900;
  font-size:1rem;
  cursor:pointer;
  transition:0.2s;
}

.start-btn:hover{
  transform:translateY(-2px);
}

/* HIDDEN */

.hidden{
  display:none;
}

/* GAME */

.top-bar{
  margin-bottom:20px;
  text-align:center;
}

.turn{
  font-size:1.2rem;
  font-weight:900;
}

/* BOARD */

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  padding:14px;

  background:#1a1a28;

  border-radius:24px;

  border:2px solid #2f2f45;

  box-shadow:
    0 0 25px rgba(255,255,255,0.03),
    inset 0 0 18px rgba(255,255,255,0.02);
}

/* CELLS */

.cell{
  aspect-ratio:1;

  border-radius:18px;

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  transition:0.2s;

  font-size:2.4rem;
  font-weight:900;

  background:linear-gradient(
    145deg,
    #232337,
    #1a1a2b
  );

  border:2px solid #35354f;

  box-shadow:
    inset 0 0 10px rgba(255,255,255,0.03),
    0 0 10px rgba(0,0,0,0.25);
}

.cell:hover{
  transform:scale(1.05);

  background:linear-gradient(
    145deg,
    #2b2b45,
    #212138
  );

  border-color:#4b4b70;
}

/* CURRY CELL */

.cell.curry{
  background:linear-gradient(
    145deg,
    #1d428a,
    #102a5c
  );

  border:2px solid #ffc72c;

  color:#ffc72c;

  box-shadow:
    0 0 18px rgba(255,199,44,0.35),
    inset 0 0 12px rgba(255,255,255,0.08);
}

/* RONALDO CELL */

.cell.ronaldo{
  background:linear-gradient(
    145deg,
    #ffffff,
    #e8e8e8
  );

  border:2px solid #d4af37;

  color:#111;

  box-shadow:
    0 0 18px rgba(212,175,55,0.28),
    inset 0 0 12px rgba(255,255,255,0.25);
}

/* STATUS */

.status{
  text-align:center;
  margin-top:22px;
  font-size:1.2rem;
  font-weight:900;
}

/* WIN ANIMATION */

.winner{
  animation:pop 0.4s ease;
}

@keyframes pop{

  0%{
    transform:scale(0.4);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}

</style>
</head>

<body>

<div class="watermark">
  <span>Mohazan0</span>
</div>

<div class="container">

  <!-- MENU -->

  <div class="card" id="menu">

    <h1>Tic Tac Toe</h1>

    <p class="subtitle">
      Curry 🏀 vs Ronaldo ⚽
    </p>

    <!-- PLAYER 1 -->

    <div class="player-box">

      <h2>Player 1</h2>

      <input
        type="text"
        id="p1name"
        placeholder="Enter Player 1 Name"
      >

      <div class="character-select">

        <button
          class="character-btn selected"
          id="p1curry"
          onclick="selectCharacter(1,'curry')"
        >

          <div class="jersey curry-shirt">
            <div class="jersey-number">30</div>
            <div class="jersey-name">CURRY</div>
          </div>

        </button>

        <button
          class="character-btn"
          id="p1ronaldo"
          onclick="selectCharacter(1,'ronaldo')"
        >

          <div class="jersey ronaldo-shirt">
            <div class="jersey-number">7</div>
            <div class="jersey-name">RONALDO</div>
          </div>

        </button>

      </div>

    </div>

    <!-- PLAYER 2 -->

    <div class="player-box">

      <h2>Player 2</h2>

      <input
        type="text"
        id="p2name"
        placeholder="Enter Player 2 Name"
      >

      <div class="character-select">

        <button
          class="character-btn"
          id="p2curry"
          onclick="selectCharacter(2,'curry')"
        >

          <div class="jersey curry-shirt">
            <div class="jersey-number">30</div>
            <div class="jersey-name">CURRY</div>
          </div>

        </button>

        <button
          class="character-btn selected"
          id="p2ronaldo"
          onclick="selectCharacter(2,'ronaldo')"
        >

          <div class="jersey ronaldo-shirt">
            <div class="jersey-number">7</div>
            <div class="jersey-name">RONALDO</div>
          </div>

        </button>

      </div>

    </div>

    <button class="start-btn" onclick="startGame()">
      START GAME
    </button>

  </div>

  <!-- GAME -->

  <div class="card hidden" id="game">

    <div class="top-bar">

      <div class="turn" id="turnText">
        Turn
      </div>

    </div>

    <div class="board">

      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>

      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>

      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>

    </div>

    <div class="status" id="status">
      Match Started
    </div>

  </div>

</div>

<script>

/* PLAYERS */

let player1 = {
  name:"Player 1",
  character:"curry",
  symbol:"X"
};

let player2 = {
  name:"Player 2",
  character:"ronaldo",
  symbol:"O"
};

let currentPlayer = player1;

let board = [
  "","","",
  "","","",
  "","",""
];

let running = false;

/* WIN PATTERNS */

const winPatterns = [

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

];

/* SELECT CHARACTER */

function selectCharacter(player, character){

  if(player === 1){

    player1.character = character;

    document.getElementById('p1curry')
      .classList.remove('selected');

    document.getElementById('p1ronaldo')
      .classList.remove('selected');

    if(character === 'curry'){

      document.getElementById('p1curry')
        .classList.add('selected');

    }else{

      document.getElementById('p1ronaldo')
        .classList.add('selected');

    }

  }

  if(player === 2){

    player2.character = character;

    document.getElementById('p2curry')
      .classList.remove('selected');

    document.getElementById('p2ronaldo')
      .classList.remove('selected');

    if(character === 'curry'){

      document.getElementById('p2curry')
        .classList.add('selected');

    }else{

      document.getElementById('p2ronaldo')
        .classList.add('selected');

    }

  }

}

/* START GAME */

function startGame(){

  player1.name =
    document.getElementById('p1name').value
    || "Player 1";

  player2.name =
    document.getElementById('p2name').value
    || "Player 2";

  document.getElementById('menu')
    .classList.add('hidden');

  document.getElementById('game')
    .classList.remove('hidden');

  currentPlayer = player1;

  running = true;

  updateTurn();

}

/* UPDATE TURN */

function updateTurn(){

  document.getElementById('turnText').textContent =
    currentPlayer.name + "'s Turn";

}

/* CELLS */

const cells =
  document.querySelectorAll('.cell');

cells.forEach(cell=>{

  cell.addEventListener('click', ()=>{

    const index = cell.dataset.index;

    if(board[index] !== "" || !running){
      return;
    }

    board[index] =
      currentPlayer.symbol;

    cell.classList.add(
      currentPlayer.character
    );

    if(currentPlayer.character === 'curry'){

      cell.innerHTML = "30";

    }else{

      cell.innerHTML = "7";

    }

    checkWinner();

  });

});

/* CHECK WINNER */

function checkWinner(){

  let won = false;

  for(let pattern of winPatterns){

    let a = pattern[0];
    let b = pattern[1];
    let c = pattern[2];

    if(
      board[a] &&
      board[a] === board[b] &&
      board[a] === board[c]
    ){

      won = true;

    }

  }

  if(won){

    running = false;

    document.getElementById('status').innerHTML =

      "<div class='winner'>🏆 "
      + currentPlayer.name
      + " WINS!</div>";

    setTimeout(()=>{

      alert(
        currentPlayer.name
        + " WON THE MATCH 🏆"
      );

      goMenu();

    },2000);

    return;

  }

  if(!board.includes("")){

    running = false;

    document.getElementById('status').innerHTML =

      "<div class='winner'>🤝 DRAW!</div>";

    setTimeout(()=>{

      alert("DRAW GAME 🤝");

      goMenu();

    },2000);

    return;

  }

  currentPlayer =
    currentPlayer === player1
    ? player2
    : player1;

  updateTurn();

}

/* MAIN MENU */

function goMenu(){

  resetBoard();

  document.getElementById('game')
    .classList.add('hidden');

  document.getElementById('menu')
    .classList.remove('hidden');

}

/* RESET BOARD */

function resetBoard(){

  board = [
    "","","",
    "","","",
    "","",""
  ];

  running = false;

  currentPlayer = player1;

  document.getElementById('status')
    .textContent = "Match Started";

  cells.forEach(cell=>{

    cell.innerHTML = "";

    cell.classList.remove('curry');
    cell.classList.remove('ronaldo');

  });

}

</script>

</body>
</html>
